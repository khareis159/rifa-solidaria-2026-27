const Store = (() => {

    try {
      if (!window.indexedDB) return fallback();

        rq.onupgradeneeded = () => { const d = rq.result; for (const s of ST) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
        rq.onerror = fallback; rq.onblocked = fallback;
